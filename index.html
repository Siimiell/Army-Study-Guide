<!DOCTYPE html>
<html lang="en">
<head>

<title>3-16 CAV Board Study Guide</title>
<style>
:root{--navy:#141E33;--panel:#1D2A47;--panel2:#243556;--gold:#C9A227;--green:#7FC97F;--red:#E07A6B;--txt:#F2F2F2;--mut:#9AA4B5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh}
header{padding:16px 20px 8px;text-align:center;border-bottom:3px solid var(--gold)}
header h1{font-size:1.15rem;letter-spacing:.5px}
header p{color:var(--mut);font-size:.8rem;margin-top:4px}
nav{display:flex;justify-content:center;gap:8px;padding:12px}
nav button{background:var(--panel);color:var(--txt);border:1px solid #33415E;border-radius:20px;padding:8px 18px;font-size:.9rem;cursor:pointer}
nav button.act{background:var(--gold);color:#101010;font-weight:700;border-color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:0 16px 60px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
select{background:var(--panel);color:var(--txt);border:1px solid #33415E;border-radius:8px;padding:8px;font-size:.9rem;max-width:100%;flex:1}
.btn{background:var(--panel2);color:var(--txt);border:1px solid #33415E;border-radius:8px;padding:10px 16px;font-size:.95rem;cursor:pointer}
.btn.gold{background:var(--gold);color:#101010;font-weight:700;border-color:var(--gold)}
.btn.green{background:var(--green);color:#101010;font-weight:700;border-color:var(--green)}
.btn.red{background:var(--red);color:#101010;font-weight:700;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--panel);border:1px solid #33415E;border-radius:14px;padding:26px 22px;min-height:240px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card .tag{color:var(--gold);font-size:.75rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.card .body{font-size:1.15rem;line-height:1.5}
.card.ans .tag{color:var(--green)}
.card .hint{color:var(--mut);font-size:.8rem;margin-top:16px}
.meta{color:var(--mut);font-size:.85rem;text-align:center;margin:6px 0}
.scorebar{display:flex;gap:14px;justify-content:center;font-size:.9rem;margin:8px 0}
.scorebar b{color:var(--green)} .scorebar i{color:var(--red);font-style:normal}
.done{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:30px;text-align:center;margin:20px 0}
.done h2{color:var(--gold);margin-bottom:10px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid #33415E;color:var(--mut);text-align:center;font-size:.7rem;padding:6px}
@media (max-width:480px){.card .body{font-size:1rem}.btn{padding:10px 12px;font-size:.85rem}}
</style>
</head>

<header>
  <h1>3-16 CAV Junior Enlisted Board Study Guide</h1>
  <p>June 2026 — board convenes 0900, 25 JUN 2026 - Squadron Command Conference Room</p>

  </div>
  <div class="scorebar" id="scorebar" style="display:none">
    <span>Score: <b id="right">0</b> / <i id="wrong">0</i></span>
    <span id="pct"></span>
  </div>
  <div id="stage"></div>

<footer>Built from the 29 MAY 2026 Squadron MOI - verify current doctrine with your sponsor</footer>
<script>
const DATA=[{"s":"The NCO Creed (key points)","q":"When and where was the NCO Creed written?","a":"In 1973, by the NCO Subcommittee at the NCO Academy, Fort Benning, Georgia."},{"s":"The NCO Creed (key points)","q":"What is the Warrior Ethos?","a":"The four lines in the Soldier's Creed: I will always place the mission first; I will never accept defeat; I will never quit; I will never leave a fallen comrade."},{"s":"The NCO Creed (key points)","q":"Where is the Soldier's Creed found?","a":"TC 7-22.7 (The NCO Guide)."},{"s":"Unit History — 3d Squadron, 16th Cavalry","q":"What is the motto of the 16th Cavalry Regiment?","a":"Strike Hard."},{"s":"Unit History — 3d Squadron, 16th Cavalry","q":"Who is the Squadron Command Sergeant Major?","a":"CSM Snyder (the board president). Know your full chain of command and NCO support channel by name and duty position."},{"s":"Army Programs (TC 7-22.7, Chapter 8)","q":"What does ACE stand for?","a":"Ask, Care, Escort — the Army suicide prevention model."},{"s":"Army Programs (TC 7-22.7, Chapter 8)","q":"What does BOSS stand for?","a":"Better Opportunities for Single Soldiers — quality of life, recreation and leisure, and community service."},{"s":"Army Programs (TC 7-22.7, Chapter 8)","q":"What is AER?","a":"Army Emergency Relief — provides emergency financial assistance to Soldiers and families through interest-free loans and grants."},{"s":"Army Programs (TC 7-22.7, Chapter 8)","q":"What regulation covers the Army Body Composition Program?","a":"AR 600-9."},{"s":"Army Programs (TC 7-22.7, Chapter 8)","q":"What is ASAP?","a":"The Army Substance Abuse Program (AR 600-85) — prevention, education, and treatment for alcohol and drug abuse."},{"s":"Army Programs (TC 7-22.7, Chapter 8)","q":"What is the Total Army Sponsorship Program?","a":"The program that assigns sponsors to inbound Soldiers and families to help them integrate into a new unit (AR 600-8-8)."},{"s":"Army Programs (TC 7-22.7, Chapter 8)","q":"What is ACS?","a":"Army Community Service — installation programs supporting Soldier and family readiness (financial readiness, relocation, family advocacy, and more)."},{"s":"Soldier Combat Skills / M4 and M16 (TC 3-21.75, TC 3-22.9)","q":"Describe the M4 carbine.","a":"A 5.56mm, magazine-fed, gas-operated, air-cooled, shoulder-fired weapon."},{"s":"Soldier Combat Skills / M4 and M16 (TC 3-21.75, TC 3-22.9)","q":"What is the maximum effective range of the M4?","a":"500 meters for a point target; 600 meters for an area target."},{"s":"Soldier Combat Skills / M4 and M16 (TC 3-21.75, TC 3-22.9)","q":"What is the maximum effective range of the M16A2?","a":"550 meters for a point target; 800 meters for an area target."},{"s":"Soldier Combat Skills / M4 and M16 (TC 3-21.75, TC 3-22.9)","q":"Name the eight steps in the cycle of function.","a":"Feeding, chambering, locking, firing, unlocking, extracting, ejecting, and cocking."},{"s":"Soldier Combat Skills / M4 and M16 (TC 3-21.75, TC 3-22.9)","q":"What are the functional elements of the shot process?","a":"Stability, aim, control, and movement (TC 3-22.9)."},{"s":"Soldier Combat Skills / M4 and M16 (TC 3-21.75, TC 3-22.9)","q":"What is the immediate action for a stoppage?","a":"Perform immediate action: tap the magazine, rack the charging handle, and reassess (remembered by many as SPORTS — Slap, Pull, Observe, Release, Tap, Squeeze)."},{"s":"Soldier Combat Skills / M4 and M16 (TC 3-21.75, TC 3-22.9)","q":"What are the four weapon safety rules?","a":"Treat every weapon as if it is loaded; never point the weapon at anything you do not intend to engage; keep your finger off the trigger until ready; keep the weapon on safe until you intend to fire."},{"s":"Military Justice (AR 27-10)","q":"What are the three types of courts-martial?","a":"Summary, special, and general."},{"s":"Military Justice (AR 27-10)","q":"What are the levels of nonjudicial punishment (Article 15)?","a":"Summarized, company grade, and field grade."},{"s":"Military Justice (AR 27-10)","q":"What are the maximum punishments under a field grade Article 15?","a":"Reduction of one or more grades (E-4 and below), forfeiture of half a month's pay for two months, 45 days extra duty, and 60 days restriction."},{"s":"Military Justice (AR 27-10)","q":"What is Article 31?","a":"The UCMJ article covering rights against self-incrimination — a Soldier must be informed of the nature of the accusation and the right to remain silent before questioning."},{"s":"Military Justice (AR 27-10)","q":"Can a Soldier refuse an Article 15?","a":"Yes — a Soldier may demand trial by court-martial instead (except when embarked on a vessel)."},{"s":"Military Justice (AR 27-10)","q":"What UCMJ article covers absence without leave?","a":"Article 86."},{"s":"Military Justice (AR 27-10)","q":"What article covers failure to obey an order or regulation?","a":"Article 92."},{"s":"Drill and Ceremonies (TC 3-21.5)","q":"What are the two parts of a drill command?","a":"The preparatory command and the command of execution."},{"s":"Drill and Ceremonies (TC 3-21.5)","q":"Name a combined command.","a":"FALL IN, AT EASE, and REST combine both parts into one command."},{"s":"Drill and Ceremonies (TC 3-21.5)","q":"What are the four rest positions at the halt?","a":"Parade rest, stand at ease, at ease, and rest."},{"s":"Drill and Ceremonies (TC 3-21.5)","q":"What is the length and cadence of the quick time step?","a":"30 inches at 120 steps per minute."},{"s":"Drill and Ceremonies (TC 3-21.5)","q":"What is the cadence of double time?","a":"180 steps per minute (36-inch step)."},{"s":"Drill and Ceremonies (TC 3-21.5)","q":"What are the elements of the command voice?","a":"Loudness, projection, distinctness, inflection, and snap."},{"s":"Drill and Ceremonies (TC 3-21.5)","q":"From what position are all stationary movements executed?","a":"The position of attention."},{"s":"Casualty Evacuation (ATP 4-02.13)","q":"What is the difference between CASEVAC and MEDEVAC?","a":"CASEVAC is movement of casualties on nonmedical vehicles or aircraft without en route medical care; MEDEVAC uses dedicated, marked medical platforms with en route care."},{"s":"Casualty Evacuation (ATP 4-02.13)","q":"What are the evacuation precedence categories?","a":"Priority I — Urgent (within 1 hour); Priority IA — Urgent Surgical; Priority II — Priority (within 4 hours); Priority III — Routine (within 24 hours); Priority IV — Convenience."},{"s":"Casualty Evacuation (ATP 4-02.13)","q":"What are the first five lines of the 9-line MEDEVAC request?","a":"1 — Pickup location; 2 — Radio frequency and call sign; 3 — Number of patients by precedence; 4 — Special equipment required; 5 — Number of patients by type (litter or ambulatory)."},{"s":"Casualty Evacuation (ATP 4-02.13)","q":"What are lines 6 through 9?","a":"6 — Security at pickup site (wartime) or number and type of wound (peacetime); 7 — Method of marking the site; 8 — Patient nationality and status; 9 — CBRN contamination (wartime) or terrain description (peacetime)."},{"s":"Sustainment (ADP 4-0)","q":"What are the four elements of sustainment?","a":"Logistics, financial management, personnel services, and health service support."},{"s":"Sustainment (ADP 4-0)","q":"Name the principles of sustainment.","a":"Integration, anticipation, responsiveness, simplicity, economy, survivability, continuity, and improvisation."},{"s":"Sustainment (ADP 4-0)","q":"What is logistics?","a":"Planning and executing the movement and support of forces — includes supply, maintenance, transportation, field services, distribution, operational contract support, and general engineering support."},{"s":"Situational: SHARP and Fitness","q":"What are the two SHARP reporting options?","a":"Restricted reporting (confidential — through the SARC, victim advocate, or healthcare personnel; no command or law enforcement notification) and unrestricted reporting (command and law enforcement are notified for investigation)."},{"s":"Situational: SHARP and Fitness","q":"What form documents a sexual assault reporting preference?","a":"DD Form 2910."},{"s":"Situational: SHARP and Fitness","q":"A Soldier tells you they were assaulted but does not want anyone to know. What do you do?","a":"Protect their options — do not spread the information. Connect them with the SARC or victim advocate so they can choose restricted or unrestricted reporting, and continue to support them."},{"s":"Situational: SHARP and Fitness","q":"What are the five events of the AFT?","a":"3-repetition maximum deadlift, hand-release push-up, sprint-drag-carry, plank, and 2-mile run — minimum 60 points per event."},{"s":"Situational: SHARP and Fitness","q":"What are the five H2F domains?","a":"Physical, mental, sleep, nutrition, and spiritual readiness (FM 7-22)."},{"s":"Wear and Appearance of Army Uniforms (AR 670-1 / DA PAM 670-1)","q":"What is the difference between AR 670-1 and DA PAM 670-1?","a":"AR 670-1 is the policy for wear and appearance; DA PAM 670-1 gives the detailed how-to guidance for wearing each uniform and its components."},{"s":"Wear and Appearance of Army Uniforms (AR 670-1 / DA PAM 670-1)","q":"Who is responsible for uniform standards?","a":"Commanders and leaders at all levels ensure Soldiers under their control present a neat and soldierly appearance; each Soldier is responsible for their own appearance."},{"s":"Wear and Appearance of Army Uniforms (AR 670-1 / DA PAM 670-1)","q":"What jewelry may be worn in uniform?","a":"A wristwatch, a wrist identification bracelet, and up to two rings (a wedding set counts as one); no visible ornamentation while in field environments per command policy."},{"s":"Wear and Appearance of Army Uniforms (AR 670-1 / DA PAM 670-1)","q":"How should ribbons be worn on the AGSU?","a":"Centered and aligned per DA PAM 670-1 measurements — have your sponsor verify your rack and nameplate placement with a ruler before board day."},{"s":"Wear and Appearance of Army Uniforms (AR 670-1 / DA PAM 670-1)","q":"What is the Class B AGSU?","a":"The Army Green Service Uniform worn without the coat — shirt with appropriate insignia, trousers/slacks or skirt, and authorized accessories; this is the board uniform per the MOI."},{"s":"Army Leadership (ADP 6-22)","q":"Define leadership.","a":"The activity of influencing people by providing purpose, direction, and motivation to accomplish the mission and improve the organization."},{"s":"Army Leadership (ADP 6-22)","q":"What is the Leadership Requirements Model?","a":"Attributes — character, presence, and intellect; Competencies — leads, develops, and achieves."},{"s":"Army Leadership (ADP 6-22)","q":"What are the Army Values?","a":"Loyalty, Duty, Respect, Selfless Service, Honor, Integrity, and Personal Courage (LDRSHIP). Be ready to define each and give an example."},{"s":"Army Leadership (ADP 6-22)","q":"What are the three levels of leadership?","a":"Direct, organizational, and strategic."},{"s":"Army Leadership (ADP 6-22)","q":"What is the difference between counseling, coaching, and mentoring?","a":"Counseling is a structured review of performance or events by the rater; coaching guides development of skills; mentoring is a voluntary developmental relationship based on mutual trust and respect."},{"s":"Army Leadership (ADP 6-22)","q":"What is presence?","a":"How a leader is perceived — military and professional bearing, fitness, confidence, and resilience."},{"s":"Guard Duty (TC 3-22.6)","q":"Recite the three general orders.","a":"1: I will guard everything within the limits of my post and quit my post only when properly relieved. 2: I will obey my special orders and perform all of my duties in a military manner. 3: I will report violations of my special orders, emergencies, and anything not covered in my instructions to the commander of the relief."},{"s":"Guard Duty (TC 3-22.6)","q":"What are the two types of guard duty?","a":"Interior guard and exterior guard."},{"s":"Guard Duty (TC 3-22.6)","q":"What governs what a guard does on a specific post?","a":"Special orders, which supplement the general orders for that post."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"What are the five major terrain features?","a":"Hill, ridge, valley, saddle, and depression."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"What are the three minor terrain features?","a":"Draw, spur, and cliff."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"What are the two supplementary terrain features?","a":"Cut and fill."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"What do the colors on a military map mean?","a":"Black — man-made features; blue — water; green — vegetation; brown — relief and contour; red — main roads and built-up areas; red-brown on red-light readable maps — contours and cultural features."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"How accurate is an 8-digit grid coordinate?","a":"Within 10 meters (6-digit: 100 meters; 4-digit: 1,000 meters)."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"How do you compute a back azimuth?","a":"Add 180 degrees if the azimuth is 180 or less; subtract 180 if it is more than 180."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"What are the three norths?","a":"True north, grid north, and magnetic north — shown on the declination diagram."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"What are the three types of contour lines?","a":"Index, intermediate, and supplementary."},{"s":"Land Navigation / Map Reading (TC 3-25.26)","q":"What are the two field techniques for locating an unknown point?","a":"Intersection (locating a distant point from known positions) and resection (locating your own position from known points)."},{"s":"First Aid and Field Sanitation (TC 4-02.1 / TC 4-02.3)","q":"What does MARCH stand for?","a":"Massive hemorrhage, Airway, Respiration, Circulation, Head injury/Hypothermia — the sequence for treating casualties."},{"s":"First Aid and Field Sanitation (TC 4-02.1 / TC 4-02.3)","q":"What are the three phases of Tactical Combat Casualty Care?","a":"Care under fire, tactical field care, and tactical evacuation care."},{"s":"First Aid and Field Sanitation (TC 4-02.1 / TC 4-02.3)","q":"What is the first priority for a casualty with severe bleeding from a limb?","a":"Stop the bleeding — apply a tourniquet high and tight on the limb, note the time, and mark a T on the casualty's forehead."},{"s":"First Aid and Field Sanitation (TC 4-02.1 / TC 4-02.3)","q":"What are the heat injuries from least to most severe?","a":"Heat cramps, heat exhaustion, and heat stroke — heat stroke is a medical emergency."},{"s":"First Aid and Field Sanitation (TC 4-02.1 / TC 4-02.3)","q":"Name common cold weather injuries.","a":"Chilblain, immersion (trench) foot, frostbite, and hypothermia."},{"s":"First Aid and Field Sanitation (TC 4-02.1 / TC 4-02.3)","q":"What is the role of the unit field sanitation team?","a":"Advise the commander and train Soldiers on water treatment, food sanitation, waste disposal, pest control, and personal hygiene to prevent disease and non-battle injury."},{"s":"First Aid and Field Sanitation (TC 4-02.1 / TC 4-02.3)","q":"What are the five F's of disease transmission?","a":"Feces, fingers, flies, food, and fluids."},{"s":"Army History (AR 870-5)","q":"When was the U.S. Army established?","a":"14 June 1775 — the Army's birthday; it is the oldest of the armed services."},{"s":"Army History (AR 870-5)","q":"Who was the first Commander in Chief of the Continental Army?","a":"General George Washington."},{"s":"Army History (AR 870-5)","q":"What is the highest U.S. military award?","a":"The Medal of Honor, first authorized in 1862."},{"s":"Army History (AR 870-5)","q":"When was the Army flag adopted?","a":"1956."},{"s":"Army History (AR 870-5)","q":"Who was the first Sergeant Major of the Army?","a":"SMA William O. Wooldridge, appointed in 1966."},{"s":"Army History (AR 870-5)","q":"What document shaped the role of the American NCO?","a":"The Blue Book — Baron von Steuben's Regulations for the Order and Discipline of the Troops of the United States, 1779."},{"s":"Situational: Suicide Prevention and Reenlistment","q":"What is ACE?","a":"Ask, Care, Escort: ask directly if your battle buddy is thinking of harming themself, care by listening without judgment and removing means, and escort them to the chain of command, chaplain, behavioral health, or the emergency room — never leave them alone."},{"s":"Situational: Suicide Prevention and Reenlistment","q":"What is the crisis line number?","a":"988, then press 1 for the Veterans/Military Crisis Line."},{"s":"Situational: Suicide Prevention and Reenlistment","q":"A Soldier tells you life isn't worth living. What do you do?","a":"Take it seriously. Ask the direct question, stay with them, and escort them to help immediately; notify the chain of command."},{"s":"Situational: Suicide Prevention and Reenlistment","q":"What regulation covers the Army retention program?","a":"AR 601-280. The career counselor manages reenlistment; know your reenlistment window and available options (training, stabilization, station of choice, bonus when authorized)."},{"s":"Equal Opportunity","q":"What is the Army EO policy?","a":"To provide equal opportunity and fair treatment for all Soldiers and families regardless of race, color, religion, sex, or national origin, and to maintain an environment free of unlawful discrimination and harassment (AR 600-20; AR 690-12 covers Department of the Army civilian EEO)."},{"s":"Equal Opportunity","q":"What are the two types of EO complaints?","a":"Informal (resolved at the lowest level, not necessarily in writing) and formal (filed in writing on DA Form 7279, normally within 60 calendar days of the incident)."},{"s":"Equal Opportunity","q":"Besides the chain of command, where can a Soldier take an EO complaint?","a":"The EO advisor, IG, chaplain, provost marshal, medical agency, or legal assistance office."},{"s":"Counseling (ATP 6-22.1)","q":"What are the three categories of developmental counseling?","a":"Event counseling, performance counseling, and professional growth counseling."},{"s":"Counseling (ATP 6-22.1)","q":"What are the four stages of the counseling process?","a":"Identify the need, prepare for counseling, conduct the counseling, and follow up."},{"s":"Counseling (ATP 6-22.1)","q":"What form documents counseling?","a":"DA Form 4856 (Developmental Counseling Form)."},{"s":"Counseling (ATP 6-22.1)","q":"What are the counseling approaches?","a":"Directive, nondirective, and combined."},{"s":"Counseling (ATP 6-22.1)","q":"What qualities must a counselor have?","a":"Respect for subordinates, self-awareness, cultural awareness, empathy, and credibility."},{"s":"Code of Conduct (AR 350-30)","q":"How many articles are in the Code of Conduct?","a":"Six."},{"s":"Code of Conduct (AR 350-30)","q":"Recite Article I.","a":"I am an American, fighting in the forces which guard my country and our way of life. I am prepared to give my life in their defense."},{"s":"Code of Conduct (AR 350-30)","q":"What does Article III cover?","a":"Resistance as a prisoner: If I am captured I will continue to resist by all means available. I will make every effort to escape and aid others to escape. I will accept neither parole nor special favors from the enemy."},{"s":"Code of Conduct (AR 350-30)","q":"Under Article V, what information may you give if captured?","a":"Name, rank, service number, and date of birth; evade answering further questions to the utmost of your ability."},{"s":"Code of Conduct (AR 350-30)","q":"When does the Code of Conduct apply?","a":"At all times — in combat and in captivity, to every member of the armed forces."},{"s":"CBRN (FM 3-11)","q":"What does CBRN stand for?","a":"Chemical, Biological, Radiological, and Nuclear."},{"s":"CBRN (FM 3-11)","q":"How quickly must you don your protective mask?","a":"Within 9 seconds; hood and remaining adjustments within 15 seconds total."},{"s":"CBRN (FM 3-11)","q":"What are the MOPP levels?","a":"MOPP 0 through MOPP 4 — increasing protection from gear available/carried to full suit, boots, mask, and gloves at MOPP 4."},{"s":"CBRN (FM 3-11)","q":"What are the three types of decontamination?","a":"Immediate, operational, and thorough."},{"s":"CBRN (FM 3-11)","q":"What are the ways to alert Soldiers of a chemical attack?","a":"Vocal alarm (GAS, GAS, GAS), arm-and-hand signals, percussion alarms, and automatic alarm systems."},{"s":"CBRN (FM 3-11)","q":"What detector paper detects liquid chemical agents?","a":"M8 paper (sheets, color-changing) and M9 tape (worn on the uniform, detects presence but not type)."},{"s":"NCO Duties, History, Responsibilities, Authority (AR 600-20 / TC 7-22.7)","q":"What are the three types of duties?","a":"Specified duties (directed by regulation or orders), directed duties (assigned by a superior), and implied duties (inferred from the mission or position)."},{"s":"NCO Duties, History, Responsibilities, Authority (AR 600-20 / TC 7-22.7)","q":"What is the NCO support channel?","a":"The channel of communication and supervision from the command sergeant major to first sergeants and other NCOs — it parallels and reinforces the chain of command."},{"s":"NCO Duties, History, Responsibilities, Authority (AR 600-20 / TC 7-22.7)","q":"Where does an NCO's authority come from?","a":"Command authority delegated through the chain of command, and general military authority inherent in rank and position under AR 600-20."},{"s":"NCO Duties, History, Responsibilities, Authority (AR 600-20 / TC 7-22.7)","q":"When is the birth of the NCO Corps?","a":"14 June 1775, with the birth of the Continental Army; the NCO role was standardized by von Steuben's Blue Book in 1779."},{"s":"NCO Duties, History, Responsibilities, Authority (AR 600-20 / TC 7-22.7)","q":"Who is the senior enlisted Soldier in the Army?","a":"The Sergeant Major of the Army."},{"s":"Army Command Policy (AR 600-20)","q":"What does AR 600-20 cover?","a":"Army command policy — command authority and responsibility, military discipline and conduct, the NCO support channel, EO/MEO and harassment prevention, relationships between Soldiers, and corrective training policy."},{"s":"Army Command Policy (AR 600-20)","q":"Who assumes command in the commander's absence?","a":"The senior regularly assigned member present for duty, unless otherwise designated."},{"s":"Army Command Policy (AR 600-20)","q":"What is the policy on hazing and bullying?","a":"Prohibited in all forms; every Soldier has a duty to report it."},{"s":"Army Command Policy (AR 600-20)","q":"What is corrective training?","a":"Training or instruction directly related to the deficiency, used to correct it — it must not be punishment and ends when the deficiency is corrected."},{"s":"Situational: Drugs/Alcohol and Missing NCOPD","q":"You suspect your battle buddy is misusing alcohol. What do you do?","a":"Talk to them, encourage self-referral to ASAP/SUDCC (AR 600-85), and inform the chain of command if their safety or readiness is at risk. Self-referral before an incident protects the Soldier and gets them help."},{"s":"Situational: Drugs/Alcohol and Missing NCOPD","q":"What is the Limited Use Policy?","a":"Under AR 600-85, certain evidence (such as a self-referral) cannot be used against a Soldier in UCMJ action or to characterize discharge — it encourages Soldiers to seek help."},{"s":"Situational: Drugs/Alcohol and Missing NCOPD","q":"A Soldier repeatedly misses NCO professional development sessions. As a leader, what do you do?","a":"Conduct event counseling on DA Form 4856, identify the cause, re-emphasize the requirement and its purpose, apply corrective training if appropriate, and escalate through the NCO support channel if it continues."}];
let mode='flash', deck=[], idx=0, flipped=false, right=0, wrong=0, missed=[], shuffled=false;
const $=id=>document.getElementById(id);
const subjects=[...new Set(DATA.map(d=>d.s))];
$('subject').innerHTML='<option value="">All subjects ('+DATA.length+')</option>'+subjects.map(s=>'<option>'+s+'</option>').join('');

function save(){try{localStorage.setItem('cav316',JSON.stringify({right,wrong}))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('cav316'));if(v){right=v.right||0;wrong=v.wrong||0}}catch(e){}}
load();

function buildDeck(){
  const s=$('subject').value;
  deck=DATA.filter(d=>!s||d.s===s).slice();
  if(shuffled) deck.sort(()=>Math.random()-.5);
  idx=0; flipped=false; missed=[]; render();
}
function setMode(m){
  mode=m; right=0; wrong=0;
  $('tabFlash').classList.toggle('act',m==='flash');
  $('tabQuiz').classList.toggle('act',m==='quiz');
  $('scorebar').style.display=m==='quiz'?'flex':'none';
  buildDeck();
}
function card(){return deck[idx]}
function render(){
  const c=card(), st=$('stage'), ct=$('controls');
  if(!c){ // quiz finished
    const total=right+wrong, pct=total?Math.round(right/total*100):0;
    st.innerHTML='<div class="done"><h2>'+(mode==='quiz'?'Drill complete':'No cards')+'</h2>'+
      (mode==='quiz'?'<p>'+right+' of '+total+' correct ('+pct+'%).</p><p style="margin-top:8px;color:var(--mut)">'+(missed.length?missed.length+' missed — run them again.':'Clean run. Strike Hard!')+'</p>':'')+'</div>';
    ct.innerHTML='';
    if(mode==='quiz'){
      ct.innerHTML='<button class="btn gold" id="again">Restart</button>'+(missed.length?' <button class="btn" id="redo">Drill missed only</button>':'');
      $('again').onclick=buildDeck;
      if(missed.length)$('redo').onclick=()=>{deck=missed.slice();missed=[];idx=0;right=0;wrong=0;flipped=false;render()};
    }
    $('meta').textContent=''; updateScore(); return;
  }
  const showA=flipped;
  st.innerHTML='<div class="card'+(showA?' ans':'')+'" id="cardEl"><div class="tag">'+c.s+(showA?' — Answer':'')+'</div>'+
    '<div class="body">'+(showA?c.a:c.q)+'</div>'+
    '<div class="hint">'+(showA?'':'Tap card to reveal answer')+'</div></div>';
  $('cardEl').onclick=()=>{flipped=!flipped;render()};
  if(mode==='flash'){
    ct.innerHTML='<button class="btn" id="prev">&#8592; Prev</button> <button class="btn gold" id="flip">'+(showA?'Show question':'Show answer')+'</button> <button class="btn" id="next">Next &#8594;</button>';
    $('prev').onclick=()=>{if(idx>0){idx--;flipped=false;render()}};
    $('next').onclick=()=>{if(idx<deck.length-1){idx++;flipped=false;render()}};
    $('flip').onclick=()=>{flipped=!flipped;render()};
    $('prev').disabled=idx===0; $('next').disabled=idx===deck.length-1;
  }else{
    ct.innerHTML=showA?'<button class="btn green" id="got">Got it</button> <button class="btn red" id="miss">Missed it</button>'
      :'<button class="btn gold" id="flip">Show answer</button>';
    if(showA){
      $('got').onclick=()=>{right++;advance()};
      $('miss').onclick=()=>{wrong++;missed.push(c);advance()};
    }else $('flip').onclick=()=>{flipped=true;render()};
  }
  $('meta').textContent='Card '+(idx+1)+' of '+deck.length;
  updateScore();
}
function advance(){save();idx++;flipped=false;render()}
function updateScore(){$('right').textContent=right;$('wrong').textContent=wrong;
  const t=right+wrong;$('pct').textContent=t?Math.round(right/t*100)+'%':''}
$('tabFlash').onclick=()=>setMode('flash');
$('tabQuiz').onclick=()=>setMode('quiz');
$('subject').onchange=buildDeck;
$('shuffle').onclick=()=>{shuffled=!shuffled;$('shuffle').textContent=shuffled?'Shuffled ✓':'Shuffle';buildDeck()};
buildDeck();
</script>
</body>
</html>
